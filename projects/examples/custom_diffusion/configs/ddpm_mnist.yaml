# DDPM Configuration for MNIST
# Quick training example for demonstrating the Custom Diffusion project

# Model settings
model:
  type: "ddpm"
  image_size: 32
  in_channels: 1  # Grayscale for MNIST
  out_channels: 1
  model_channels: 64
  channel_mult: [1, 2, 2]
  num_res_blocks: 2
  attention_resolutions: [16]
  num_heads: 4
  dropout: 0.1

# Diffusion settings
diffusion:
  timesteps: 1000
  schedule_type: "cosine"  # cosine, linear
  beta_start: 0.0001
  beta_end: 0.02
  objective: "noise"  # noise or x0

# Data
data:
  dataset: "mnist"
  data_dir: "./data"
  image_size: 32
  batch_size: 128
  num_workers: 4
  normalize: true

# Training
training:
  epochs: 20
  lr: 0.0002
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0
  ema_decay: 0.9999
  gradient_clip: 1.0
  mixed_precision: true
  device: "cuda"

# Checkpointing
checkpoint:
  save_dir: "./checkpoints"
  save_interval: 5  # Save every N epochs
  save_best: true
  save_top_k: 3
  resume_from: null

# Logging
logging:
  log_dir: "./logs"
  experiment_name: "ddpm_mnist"
  log_interval: 50  # Log every N steps
  eval_interval: 1  # Evaluate every N epochs
  visualize_interval: 2  # Visualize samples every N epochs
  num_samples: 16  # Number of samples to generate
  tensorboard: true
  wandb:
    enabled: false
    project: "custom-diffusion"
    entity: null

# Misc
seed: 42
