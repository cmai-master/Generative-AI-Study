# Generative Model Base Configuration

# Model Configuration
model:
  name: "GenerativeModel"
  type: "vae"  # Options: vae, gan, diffusion, flow
  latent_dim: 128
  hidden_dims: [512, 256, 128]
  image_size: 64
  in_channels: 3
  out_channels: 3

# Data Configuration
data:
  dataset: "mnist"  # Options: mnist, cifar10, celeba, custom
  data_dir: "./data"
  batch_size: 128
  num_workers: 4
  pin_memory: true
  shuffle: true
  # Custom dataset path (if dataset=="custom")
  train_dir: null
  val_dir: null

# Training Configuration
training:
  epochs: 100
  lr: 0.0001
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0
  optimizer: "adam"  # Options: adam, adamw, sgd
  scheduler: "cosine"  # Options: cosine, step, exponential, none
  gradient_clip: 1.0
  mixed_precision: false  # Use AMP for faster training

  # Early stopping
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.001

# Logging Configuration
logging:
  log_dir: "./logs"
  experiment_name: "exp_001"
  tensorboard: true
  wandb:
    enabled: false
    project: "generative-models"
    entity: null
  log_interval: 100  # Log every N iterations
  save_interval: 10   # Save checkpoint every N epochs
  eval_interval: 5    # Evaluate every N epochs
  visualize_interval: 5  # Generate samples every N epochs

# Checkpoint Configuration
checkpoint:
  save_dir: "./checkpoints"
  save_best: true
  save_last: true
  save_top_k: 3  # Keep top K best checkpoints
  resume_from: null  # Path to checkpoint to resume from

# Evaluation Configuration
evaluation:
  metrics: ["fid", "is"]  # Metrics to compute
  num_samples: 10000  # Number of samples for evaluation
  batch_size: 100

# Generation Configuration
generation:
  num_samples: 64
  output_dir: "./samples"
  save_format: "png"
  nrow: 8  # Number of images per row in grid

# Hardware Configuration
hardware:
  device: "cuda"  # Options: cuda, cpu
  gpu_ids: [0]
  distributed: false
  num_gpus: 1

# Reproducibility
seed: 42
deterministic: false
